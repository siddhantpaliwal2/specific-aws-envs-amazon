name: CI

# Controls when the workflow will run
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains all the steps to lint, build, test and deploy for the api, transformer, and scheduler. All use the same repository, and are all package with the same code, just running in various envs.
    build:
        # The type of runner that the job will run on
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v3

            - name: Install dependencies
              run: npm ci

            # Run the linter
            - name: Run Lint
              run: npm run lint

            # Run the test(er)
            - name: Run test
              run: npm run test:ci

            - name: Run API tests
              run: npm run test:api
    docker:
        runs-on: [self-hosted]
        steps:
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '18'
            - name: checkout repo
              uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1-node16
              with:
                  aws-access-key-id: ${{ secrets.KUBERNETES_DEPLOYMENT_KEY }}
                  aws-secret-access-key: ${{ secrets.KUBERNETES_DEPLOYMENT_SECRET }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Add SHORT_SHA env property with commit short sha
              run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

            - name: Build, tag, and push QA image to Amazon ECR
              env:
                  DEV_ENV_TRANSFORMER: ${{ secrets.DEV_ENV_TRANSFORMER }}
              run: docker build -t 123456789012.dkr.ecr.us-east-1.amazonaws.com/meteringco-agent-transformer:${SHORT_SHA} . && docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/meteringco-agent-transformer:${SHORT_SHA}

    docs:
        runs-on: [self-hosted]
        steps:
            - id: install-aws-cli
              uses: unfor19/install-aws-cli-action@v1

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '18'
            - name: checkout repo
              uses: actions/checkout@v3

            - name: Install dependencies
              run: npm ci

            - name: Run build
              run: npm run build

            - name: Build and Deploy Docs
              if: github.ref == 'refs/heads/main'
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              run: npm install -g redoc-cli && npm run generate:private:specification && npm run generate:public:specification && npm run deploy:specification
