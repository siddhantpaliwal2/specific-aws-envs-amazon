schema_version = "1.4"

[task]
name = "meteringco/iam-role-validation"
version = "1.0.0"
description = "Admit a customer-supplied scraper role only after proving it: assume it as the platform under whatever external id was given, confirm the resulting session can read the account's instance inventory, turn away anything that fails as a bad request without writing the rest of the save, and treat a blank role as a clean disconnect."
keywords = ["aws", "sts", "iam", "assume-role", "external-id", "validation", "typescript", "nestjs", "settings"]

[[task.authors]]
name = "meteringco-rl-envs"

[metadata]
difficulty = "hard"
category = "aws-infrastructure"
source = "meteringco-codebases"
codebase = "meteringco-backend/top-up-billing-lifecycle"
task_kind = "feature-removal"
tags = [
    "real-codebase",
    "admission-control",
    "sts-assume-role",
    "external-id-condition",
    "trust-policy",
    "least-privilege-probe",
    "request-validation",
    "atomic-persistence",
    "credential-disconnect",
]

[agent]
user = "agent"
timeout_sec = 14400

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/app"
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 20480
network_mode = "public"

[environment.env]
TZ = "Etc/UTC"
AWS_ENDPOINT_URL = "http://127.0.0.1:4566"
AWS_ACCESS_KEY_ID = "LOCALMETERINGKEY14"
AWS_SECRET_ACCESS_KEY = "metering-secret"
# The SDK in this tree reads AWS_REGION only. A client built without an
# explicit region has no other source for it inside the container.
AWS_REGION = "us-east-1"
AWS_DEFAULT_REGION = "us-east-1"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
start_period_sec = 30
retries = 12
