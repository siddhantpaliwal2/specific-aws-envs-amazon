# Terminal settings for the recording harness.
#
# The default 2000-line history truncates the output of a large build or test
# run before an agent can scroll back to it, and the default escape-time makes
# tmux wait for an escape sequence after every keystroke that starts with one.
set -g history-limit 200000
set -sg escape-time 0

# Wide panes so long lines in specs and JSON dumps do not wrap mid-token.
set -g default-terminal "screen-256color"
setw -g aggressive-resize on
