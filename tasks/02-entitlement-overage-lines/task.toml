schema_version = "1.4"

[task]
name = "metering/entitlement-overage-lines"
version = "1.0.0"
description = "Bill metered usage against what each plan already includes: charge only the overrun, charge nothing on an unlimited or unexhausted allowance or where the plan forbids going over, and put a line on the invoice only where the plan means the customer to see one."
keywords = ["aws", "cloudwatch", "s3", "billing", "invoicing", "entitlements", "typescript", "nestjs"]

[[task.authors]]
name = "metering-rl-envs"

[metadata]
difficulty = "hard"
category = "aws-infrastructure"
source = "metering-codebases"
codebase = "metering-backend/top-up-billing-lifecycle"
task_kind = "feature-removal"
tags = [
    "real-codebase",
    "usage-entitlements",
    "overage-billing",
    "invoice-line-visibility",
    "cloudwatch-metric-series",
    "s3-configuration-documents",
    "subscription-vs-metered-plans",
    "zero-rated-dimensions",
]

[agent]
user = "agent"
timeout_sec = 14400

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/app"
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 20480
network_mode = "public"

[environment.env]
TZ = "Etc/UTC"
AWS_ENDPOINT_URL = "http://127.0.0.1:4566"
AWS_ACCESS_KEY_ID = "AKIAMETERINGBILLING1"
AWS_SECRET_ACCESS_KEY = "billing-secret"
# The SDK in this tree reads AWS_REGION only. A client built without an
# explicit region has no other source for it inside the container.
AWS_REGION = "us-east-1"
AWS_DEFAULT_REGION = "us-east-1"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
start_period_sec = 30
retries = 12
