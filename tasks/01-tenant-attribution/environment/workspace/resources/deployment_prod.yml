apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-transformer-ingress
  labels:
    app: agent-transformer-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:910000000001:certificate/29d1ce9b-2829-4b9f-9fe6-215fc354b3bf
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metering-agent-transformer-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metering-agent-transformer-service
                port:
                  number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: metering-agent-transformer-service
  annotations:
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-1:910000000001:certificate/29d1ce9b-2829-4b9f-9fe6-215fc354b3bf
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
spec:
  selector:
    app: metering-agent-transformer
  ports:
    - port: 80
      name: http
      targetPort: 3000
    - port: 443
      name: https
      targetPort: 3000
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-agent-transformer
spec:
  replicas: 3
  selector:
    matchLabels:
      name: metering-agent-transformer
      app: metering-agent-transformer
  template:
    metadata:
      labels:
        prometheus.io/scrape: 'true'
        name: metering-agent-transformer
        app: metering-agent-transformer
      spec:
            containers:
                - name: retrieval
                  image: 910000000001.dkr.ecr.us-east-1.amazonaws.com/metering-agent-transformer:prod
                  imagePullPolicy: Always
                  ports:
                    - containerPort: 3000
                  readinessProbe:
                    tcpSocket:
                        port: 3000
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  livenessProbe:
                    httpGet:
                        path: /health
                        port: 3000
                  startupProbe:
                    httpGet:
                        path: /health
                        port: 3000
                    failureThreshold: 10
                    periodSeconds: 5