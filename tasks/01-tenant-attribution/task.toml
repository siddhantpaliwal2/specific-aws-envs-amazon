schema_version = "1.4"

[task]
name = "metering/tenant-attribution"
version = "1.0.0"
description = "Bill metered EC2 usage to the customer that owes for it: sweep every onboarded account, read the business' onboarding records, honour only the customer claims an account was onboarded for, fall back to the customer an account was stood up for, split a shared machine evenly, and leave unplaceable usage off the bill."
keywords = ["aws", "ec2", "s3", "sts", "billing", "multi-tenant", "typescript", "nestjs", "attribution"]

[[task.authors]]
name = "metering-rl-envs"

[metadata]
difficulty = "hard"
category = "aws-infrastructure"
source = "metering-codebases"
codebase = "metering-backend/top-up-billing-lifecycle"
task_kind = "feature-removal"
tags = [
    "real-codebase",
    "resource-to-tenant-attribution",
    "cross-account-sweep",
    "sts-assume-role",
    "s3-onboarding-records",
    "tag-conventions",
    "shared-resource-split",
    "account-boundary",
    "unbillable-exclusion",
]

[agent]
user = "agent"
timeout_sec = 14400

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/app"
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 20480
network_mode = "public"

[environment.env]
TZ = "Etc/UTC"
AWS_ENDPOINT_URL = "http://127.0.0.1:4566"
AWS_ACCESS_KEY_ID = "AKIAMETERINGMETER01"
AWS_SECRET_ACCESS_KEY = "metering-secret"
# The SDK in this tree reads AWS_REGION only. A client built without an
# explicit region has no other source for it inside the container.
AWS_REGION = "us-east-1"
AWS_DEFAULT_REGION = "us-east-1"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
start_period_sec = 30
retries = 12
